steps:
  - group: ":mag: QA"
    key: quality_checks
    steps:
      - label: ":golangci-lint: lint"
        retry:
          automatic:
            # mise-cache exits 75 when GitHub downloads fail.
            - exit_status: 75
              limit: 2
        commands:
          - mise run check:tidy
          - mise run check:lint
        plugins:
          - ./.buildkite/plugins/mise-cache: ~
          - ./.buildkite/plugins/go-cache:
              name: go_lint

      - label: ":go: test"
        retry:
          automatic:
            - exit_status: 75
              limit: 2
        artifact_paths:
          - coverage.out
          - tests.json
        command: go test -race -count=1 -json -coverprofile=coverage.out -coverpkg=./... ./... > tests.json
        env:
          # The tests' go build inherits -race, so it reuses go test's packages and the real binary is checked too.
          GOFLAGS: -race
          # Each real-binary run would otherwise sleep 1s at exit.
          GORACE: atexit_sleep_ms=0
        plugins:
          - ./.buildkite/plugins/mise-cache: ~
          # v1.0.0, pinned by commit.
          - wolfeidau/go-test-annotate#4064140be6eb80883def24bfdbf079c2fe0b34a2:
              file: tests.json
              tparse-version: v0.18.0
          - ./.buildkite/plugins/go-cache:
              name: go_test

  - group: ":package: build"
    key: build
    steps:
      - label: ":goreleaser: snapshot"
        agents:
          queue: linux-small
        retry:
          automatic:
            - exit_status: 75
              limit: 2
        command: goreleaser release --snapshot --clean
        plugins:
          - ./.buildkite/plugins/mise-cache: ~
          - ./.buildkite/plugins/go-cache:
              name: go_build
