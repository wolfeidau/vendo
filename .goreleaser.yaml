# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: vendo

builds:
  - id: vendo
    main: ./cmd/vendo
    binary: vendo
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}

archives:
  - formats: [tar.gz]
    # No version in the name, so install.sh can use releases/latest/download.
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"

# One .sha256 per archive and SBOM for slsa-attest and github-immutable-release.
checksum:
  split: true

sboms:
  - artifacts: archive

changelog:
  disable: true
