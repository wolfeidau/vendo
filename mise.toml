[settings]
experimental = true
lockfile = true

[tools]
cosign = "3.1.4"
gh = "2.105.0"
go = "1.27.4"
golangci-lint = "2.15.0"
goreleaser = "2.20.2"
lefthook = "2.2.2"
shellcheck = "0.11.0"
syft = "1.57.2"
"go:golang.org/x/tools/gopls" = "0.24.0"

[tasks."check:tidy"]
run = "go mod tidy -diff"

[tasks."check:lint"]
run = ["golangci-lint run --timeout 3m", "shellcheck install.sh .buildkite/plugins/*/hooks/*"]
